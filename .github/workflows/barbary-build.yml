name: Barbary Link build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: barbary-link-build
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact Android and Rust toolchains
        shell: bash
        run: |
          sdkmanager 'platforms;android-37.0' 'ndk;30.0.16248370' 'build-tools;36.0.0'
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          chmod +x android/gradlew
      - name: Compile unsigned APK and AAB
        working-directory: android
        shell: bash
        run: ./gradlew :app:assembleRelease :app:bundleRelease -Pnectarlink.abis=arm64-v8a --no-daemon --console=plain
      - name: Android unit tests
        working-directory: android
        shell: bash
        run: ./gradlew :app:testReleaseUnitTest -Pnectarlink.abis=arm64-v8a --no-daemon --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-unsigned
          retention-days: 1
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/test-results/testReleaseUnitTest/*.xml
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - name: Install exact Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.12.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: false
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
      - name: Build and stage native Windows companion
        shell: pwsh
        run: ./scripts/package.ps1 -StageOnly
      - name: Check Windows UI and capture previews
        shell: pwsh
        run: ./scripts/ui-check.ps1
      - name: Compress staging files for final installer assembly
        if: always()
        shell: pwsh
        run: |
          if (Test-Path target/package/BarbaryLink) {
            Compress-Archive -Path target/package/BarbaryLink -DestinationPath target/Barbary-Link-windows-stage.zip -CompressionLevel Optimal
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-stage
          retention-days: 1
          if-no-files-found: warn
          path: |
            target/Barbary-Link-windows-stage.zip
            target/ui-check/**/screenshot.png
            target/ui-check/**/stderr.txt
