name: Barbary Link build
run-name: Barbary Link ${{ inputs.target || 'all' }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options: [all, android, windows]
permissions:
  contents: read
concurrency:
  group: barbary-link-build-${{ inputs.target || 'all' }}
  cancel-in-progress: false
jobs:
  android:
    if: inputs.target != 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '16111833'
          packages: 'platforms;android-37.0 ndk;30.0.16248370 build-tools;37.0.0'
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked
          chmod +x android/gradlew
      - name: Compile unsigned APK and AAB
        working-directory: android
        shell: bash
        run: ./gradlew :app:assembleRelease :app:bundleRelease -Pnectarlink.abis=arm64-v8a,armeabi-v7a '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' --no-daemon --console=plain
      - name: Android unit tests
        working-directory: android
        shell: bash
        run: ./gradlew :app:testReleaseUnitTest -Pnectarlink.abis=arm64-v8a,armeabi-v7a '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' --no-daemon --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-unsigned
          retention-days: 1
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/test-results/testReleaseUnitTest/*.xml
  windows:
    if: inputs.target != 'android'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - name: Install exact Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.12.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: false
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
      - name: Build and stage native Windows companion
        shell: pwsh
        run: ./scripts/package.ps1 -StageOnly
      - name: Test fork update isolation
        shell: pwsh
        run: cargo test --locked --release -p nectarlink-desktop --bin barbary-link barbary_fork_has_no_automatic_update_feed
      - name: Check Windows UI and capture previews
        shell: pwsh
        run: ./scripts/ui-check.ps1
      - name: Install NSIS and build a preflight installer
        shell: pwsh
        run: |
          ./scripts/install-nsis.ps1
          ./scripts/package.ps1 -SkipBuild
      - name: Test preflight install, launch and removal
        shell: pwsh
        run: ./scripts/smoke-installer.ps1
      - name: Compress staging files for final installer assembly
        if: always()
        shell: pwsh
        run: |
          if (Test-Path target/package/BarbaryLink) {
            Compress-Archive -Path target/package/BarbaryLink -DestinationPath target/Barbary-Link-windows-stage.zip -CompressionLevel Optimal
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-stage
          retention-days: 1
          if-no-files-found: warn
          path: |
            target/Barbary-Link-windows-stage.zip
            target/ui-check/**/*.png
            target/ui-check/**/stderr.txt
